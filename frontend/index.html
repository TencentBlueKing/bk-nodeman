        <meta charset="utf-8">

        <meta http-equiv="Cache-control" content="no-cache">
        <meta http-equiv="Cache" content="no-cache">
        <title> {{ WEB_TITLE }} </title>
        <script>
          window.PROJECT_CONFIG = (function () {
              const SITE_URL = '{{ SITE_URL }}'
              const STATIC_URL = '{{ STATIC_URL }}'
              const REMOTE_STATIC_URL = '{{ REMOTE_STATIC_URL }}'
              const RUN_VER = '{{ RUN_VER }}'
              const DEFAULT_CLOUD = '{{ DEFAULT_CLOUD }}'
              const NGINX_IP = '{{ NGINX_IP }}'
              const NGINX_PORT = '{{ NGINX_PORT }}'
              const APPO_IP = '{{ APPO_IP }}'
              const GSE_LISTEN_PORT = '{{ GSE_LISTEN_PORT }}'
              const PROXY_LISTEN_PORT = '{{ PROXY_LISTEN_PORT }}'
              const WEB_TITLE = '{{ WEB_TITLE }}'
              const USERNAME = '{{ USERNAME }}'
              const GLOBAL_TASK_CONFIG_PERMISSION = '{{ GLOBAL_TASK_CONFIG_PERMISSION }}'
              const GLOBAL_SETTING_PERMISSION = '{{ GLOBAL_SETTING_PERMISSION }}'
              const USE_IAM = '{{ USE_IAM }}'
              const APP_CODE = '{{ APP_CODE }}'
              const WXWORK_UIN = '{{ WXWORK_UIN }}'
              const DESTOP_URL = '{{ DESTOP_URL }}'
              const BKAPP_NODEMAN_CALLBACK_URL = '{{ BKAPP_NODEMAN_CALLBACK_URL }}'
              const BK_PAAS_HOST = '{{ BK_PAAS_HOST }}'
              const DEFAULT_SSH_PORT = '{{ DEFAULT_SSH_PORT }}'
              const USE_TJJ = '{{ USE_TJJ }}'
              const BK_COMPONENT_API_URL = '{{ BK_COMPONENT_API_URL }}'
              const BK_DOCS_CENTER_URL = '{{ BK_DOCS_CENTER_URL }}'
              const BK_DOMAIN = '{{ BK_DOMAIN }}'
              const BKAPP_RUN_ENV = '{{ BKAPP_RUN_ENV }}'
              const BKAPP_ENABLE_DHCP = '{{ BKAPP_ENABLE_DHCP }}'
              const TAM_ID = '{{ TAM_ID }}'
              const LOGIN_URL = '{{ LOGIN_URL }}'
              const VERSION = '{{ VERSION }}'
              const CMDB_URL = '{{ CMDB_URL }}'
              const BKAPP_NAV_HELPER_URL = '{{ BKAPP_NAV_HELPER_URL }}'
              const BKAPP_NAV_OPEN_SOURCE_URL = '{{ BKAPP_NAV_OPEN_SOURCE_URL }}'
              const ENABLE_AP_VERSION_MUTEX = '{{ ENABLE_AP_VERSION_MUTEX }}'
              const ENABLE_NOTICE_CENTER = '{{ ENABLE_NOTICE_CENTER }}'
              const BKPAAS_SHARED_RES_URL = '{{ BKPAAS_SHARED_RES_URL }}'
              const DISPLAY_TAG = '{{ DISPLAY_TAG }}'
              const API_BASE_URL = '{{ API_BASE_URL }}'
              const TENANT_ID = '{{ TENANT_ID }}'
              const ENABLE_MULTI_TENANT_MODE = '{{ ENABLE_MULTI_TENANT_MODE }}'
              const BK_IAM_SAAS_HOST = '{{ BK_IAM_SAAS_HOST }}'
              const BK_PERSONAL_CENTER_URL = '{{ BK_PERSONAL_CENTER_URL }}'
              const BK_SITE_PATH = '{{ BK_SITE_PATH }}'
              const BK_STATIC_URL = '{{ BK_STATIC_URL }}'
              

              return {
                  APP_CODE,
                  APPO_IP,
                  BK_COMPONENT_API_URL,
                  BK_DOCS_CENTER_URL,
                  BK_DOMAIN,
                  BK_PAAS_HOST,
                  BKAPP_ENABLE_DHCP,
                  BKAPP_NAV_HELPER_URL,
                  BKAPP_NAV_OPEN_SOURCE_URL,
                  BKAPP_NODEMAN_CALLBACK_URL,
                  BKAPP_RUN_ENV,
                  CMDB_URL,
                  DEFAULT_CLOUD: parseInt(DEFAULT_CLOUD),
                  DEFAULT_SSH_PORT,
                  DESTOP_URL,
                  ENABLE_AP_VERSION_MUTEX,
                  ENABLE_NOTICE_CENTER,
                  BKPAAS_SHARED_RES_URL,
                  GLOBAL_TASK_CONFIG_PERMISSION,
                  GLOBAL_SETTING_PERMISSION,
                  GSE_LISTEN_PORT,
                  LOGIN_URL,
                  NGINX_IP,
                  NGINX_PORT,
                  PROXY_LISTEN_PORT,
                  REMOTE_STATIC_URL: REMOTE_STATIC_URL,
                  RUN_VER: RUN_VER,

                  STATIC_URL: STATIC_URL,
                  TAM_ID,
                  USE_IAM,
                  USE_TJJ,
                  USERNAME,
                  VERSION,
                  WEB_TITLE,
                  WXWORK_UIN,
                  DISPLAY_TAG,
                  API_BASE_URL,
                  TENANT_ID,
                  ENABLE_MULTI_TENANT_MODE,
                  BK_IAM_SAAS_HOST,
                  BK_PERSONAL_CENTER_URL,
                  BK_STATIC_URL,
                  BK_SITE_PATH,
              }
          })()
          window.$DHCP = window.PROJECT_CONFIG.BKAPP_ENABLE_DHCP === 'True'
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script>
            window.BK_SITE_PATH = "{{ BK_SITE_PATH }}";
            window.BK_STATIC_URL = "{{ BK_STATIC_URL }}";
            
             window.__loadAssetsUrl__ = function(src){
               function joinPath(...paths) {
                 // 过滤 null/undefined
                 const validPaths = paths.filter(p => p != null).map(String);
       
                 if (validPaths.length === 0) return '';
       
                 // 检查是否以根路径开头
                 const startsWithRoot = validPaths[0].startsWith('/');
       
                 // 标准化每个路径片段：移除首尾多余斜杠
                 const normalized = validPaths.map((p, i) => {
                   if (i === 0) {
                     // 第一个路径：只移除尾部斜杠（保留开头的 /）
                     return p.replace(/[\/]+$/, '');
                   } else {
                     // 其他路径：移除首尾斜杠
                     return p.replace(/^[\/]+|[\/]+$/g, '');
                   }
                 }).filter(p => p !== '');
       
                 // 拼接
                 let result = normalized.join('/');
       
                 // 如果原始第一个路径是根路径，确保结果以 / 开头
                 if (startsWithRoot && result !== '') {
                   result = '/' + result.replace(/^\/+/, '');
                 }
       
                 return result || (startsWithRoot ? '/' : '');
               }
               return joinPath(window.BK_STATIC_URL, src);
             }
             function loadScript (src) {
               const script = document.createElement('script');
               script.src = window.__loadAssetsUrl__(src);
               document.body.appendChild(script);
             }
             function loadStyle (href) {
               const link = document.createElement('link');
               link.type = "text/css";
               link.rel = "stylesheet";
               link.href = window.__loadAssetsUrl__(href);
               document.head.appendChild(link);
             }
        </script>
        <script>
            <% for (var chunk of htmlWebpackPlugin.files.js) { %>
            loadScript("<%= chunk %>");
            <% } %>
            <% for (var chunk of htmlWebpackPlugin.files.css) { %>
            loadStyle("<%= chunk %>");
            <% } %>
        </script>
        <script src="{{ STATIC_URL }}nodeman/lib.bundle.js?t=<%= htmlWebpackPlugin.options.bundlehash %>"></script>
    </body>
</html>
